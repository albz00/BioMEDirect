<!--
* If it's an embryology lesson, change MasterCellBiology.css to MasterEmbryology.css

* Find/Replace "LessonName"
* Modify Title in <h1> if needed

* Setup Menu Groups
    - If there's only one collumn, delete group two,    goto    <div class="group2">
      (By default, two columns are created by HTML & CSS)
    - Control horizontal levels with <br> elements
    - linksLarge for main topics, linkSmall for subtopics,
    - Enter "linkNames"
    - Remember, menu# must be sequential, timestamps for each defined in JS & src_array

* Reset x & ts
-   Turn Match Case on; only change cap T, X & Zs, not lower case t, x * zs. 
-   Save as LessonNamet
-   Save as LessonNamex
-   Find/Replace x to t
-   Find/Replace z to x
-   Save as LessonNamex

-   Reopen LessonNamet
-   Find/Replace z to t
-   Save as LessonNamet

                <a href="../../../CentralMenuZ.html"><button class="btnHeader pixelBtn" id="btnToCentralMenu"><span class="label">Return to Main Menu</span></button>
                        Change   onclick='executeClick(   to   <a href= //
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="LessonNameZ" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="author" content="Jack D. Thatcher, Ph.D., West Virginia School of Osteopathic Medicine" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../../../../CommonFiles/MasterCellBiology.css">
    <link rel="stylesheet" href="../../../../CommonFiles/MasterLessons.css">
    <link rel="stylesheet" href="../../../../CommonFiles/LessonSpecificStylesheets/LessonName.css">
    <title>LessonName</title>
</head>

<body>
    <div class="entireLesson">            <!-- Lesson Container, Menu and Animation -->
        <div class="lessonMenuPage" id="lessonMenuPage" onclick="nextSlide()">    <!-- Container for Menu & Footer -->

            <header>
                <h1>LessonName</h1>
            </header>
            <div class="viScript">
                <a onclick='executeClickNewWindow("viLessonName.html")'>Script for the Visually Impaired</a>
            </div>

            <!-- Header Button Bank -->
            <div class="headBank">
                <button class="btnHeader pixelBtn" id="btnToCentralMenu" onclick='executeClick("../../../CentralMenuZ.html")'><span class="label">Return to Main Menu</span></button>
                <button class="btnHeader pixelBtn" id="btnTogTextLessonMenuX" onclick='executeClick("../../../../TextX/LessonsX/CellBiologyX/LessonNameX/IntermediateFilamentsX.html")'><span class="label">Hide Explanatory Text</span></button>
                <button class="btnHeader pixelBtn" id="btnToPopUps" onclick='executeClick("PopUpsIntermediateFilamentsX.html")'><span class="label">PopUps</span></button>
                <button class="btnHeader pixelBtn" id="btnExcerpts" onclick='executeClick("ExcerptsIntermediateFilamentsX.html")'><span class="label">Excerpts</span></button>
                <button class="btnHeader pixelBtn" id="btnQuestions" onclick='executeClick("QuestionsIntermediateFilamentsX.html")'><span class="label">Practice Questions</span></button>
                <button class="btnHeader pixelBtn" id="btnFeedback" onclick='executeClick("../../../../CommonFiles/FeedbackNetlify.html?lesson=LessonNameT")'><span class="label">Provide Feedback</span></button>
            </div>

            <!-- Lesson Menu -->
            <div class="lessonMenu">
                <div class="group1">
                    <ul class="menuLists">
                        <li><button id="menu1" class="linksLarge">linkName</button></li>
                            <li><button id="menu2" class="linksSmall">linkName</button></li>
                            <li><button id="menu3" class="linksSmall">linkName</button></li>
                        <br>
                        <br>
                        <li><button id="menu#" class="linksLarge">linkName</button></li>
                            <li><button id="menu#" class="linksSmall">linkName</button></li>
                            <li><button id="menu#" class="linksSmall">linkName</button></li>
                    </ul>
                </div>
                <div class="group2">
                    <ul class="menuLists">
                        <br>
                        <br>
                        <li><button id="menu#" class="linksLarge">linkName</button></li>
                            <li><button id="menu#" class="linksSmall">linkName</button></li>
                            <li><button id="menu#" class="linksSmall">linkName</button></li>
                            <li><button id="menu#" class="linksSmall">linkName</button></li>
                        <br>
                        <br>
                        <li><button id="menu#" class="linksLarge">linkName</button></li>
                    </ul>
                </div>
            </div>

            <!-- Footer -->
            <div class="footerLinks" >
                <a onclick='executeClick("CitationsIntermediateFilamentsX.html")'><span class="sr-only">Citations</span>Citations</a>
            </div>
        </div>

        <!-- Lesson -->
        <div id="lesson" class="lesson">
            <div class="animation" id="animation" onclick="nextSlide()">
                <video class="video" id="videoId">
				    <source id="videoSrc" src='LessonNameZ.mp4' type="video/mp4">
				    Video tag not supported
                </video>
            </div>
            <div class="lessonButtons">
                <button class="btnFooter pixelBtn" id="btnLessonMenu" onclick="self.location.href='IntermediateFilamentsX.html'"><span class="label">Return to Main Menu</span></button>
                <button class="btnFooter pixelBtn" id="btnBack"><span class="label">Go back to last scene</span></button>
                <button class="btnFooter btnRate pixelBtn" id="btnSlower" onclick="slowDown('videoId')"><span class="label">Slow Down</span></button>
                <button class="btnFooter btnRate pixelBtn" id="btnFaster" onclick="speedUp('videoId')"><span class="label">Speed Up</span></button>
            </div>
        </div>
    </div>
</body>

<script src="LessonNameZ_src_array.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="../../../../CommonFiles/masterUIcontrol.js"></script>
<script src="LessonNameZ.js"></script>
</html>
