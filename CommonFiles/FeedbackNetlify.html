<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Feedback</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="MasterLessons.css">
    <style>
        body {
            font-family: "Arial Rounded MT", Arial, sans-serif;
            background: #0a0a0a;
            color: #e6f8ff;
            padding: 3vmin;
        }
        .feedback-container {
            max-width: 720px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(2, 232, 229, 0.25);
            border-radius: 10px;
            padding: 3vmin;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        h1, h2 {
            text-align: center;
            color: #9dffff;
            margin-top: 0;
        }
        .lesson-chip {
            display: inline-block;
            padding: 0.5rem 0.9rem;
            border-radius: 999px;
            border: 1px solid #02e8e5;
            color: #02e8e5;
            background: rgba(2, 232, 229, 0.08);
            margin: 0 auto 1rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        label {
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        input, textarea {
            width: 100%;
            padding: 0.9rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #e6f8ff;
        }
        input:focus, textarea:focus {
            outline: 2px solid #02e8e5;
            border-color: #02e8e5;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            align-items: center;
        }
        button {
            padding: 0.9rem 1.6rem;
            border-radius: 6px;
            border: 1px solid #02e8e5;
            background: #02a8a6;
            color: #0a0a0a;
            font-weight: 700;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
            background: #02c4c2;
            box-shadow: 0 6px 18px rgba(2, 232, 229, 0.35);
        }
        .note {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="feedback-container">
        <h1>Lesson Feedback</h1>
        <div id="lessonChip" class="lesson-chip">Lesson</div>
        <p class="note">This form sends directly to Netlify for secure delivery.</p>

        <form id="feedbackForm" name="lesson-feedback" method="POST" action="/" target="netlify-target" data-netlify="true" netlify-honeypot="bot-field" onsubmit="return handleFeedbackSubmit(event)">
            <input type="hidden" name="form-name" value="lesson-feedback">
            <input type="hidden" name="lesson" id="lessonField" value="Unknown">
            <p class="hidden">
                <label>Don’t fill this out if you’re human: <input name="bot-field"></label>
            </p>
            <label for="name">Name (optional)</label>
            <input type="text" id="name" name="name" placeholder="Your name">

            <label for="email">Email (optional)</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">

            <label for="feedback">Feedback</label>
            <textarea id="feedback" name="feedback" rows="6" required placeholder="Tell us what worked, what didn’t, or what’s broken."></textarea>

            <label for="context">Context (device, browser, steps to reproduce)</label>
            <textarea id="context" name="context" rows="4" placeholder="Include any details that help us replicate the issue."></textarea>

            <div class="actions">
                <button type="submit" id="submitBtn">Send Feedback</button>
            </div>
            <p id="statusMessage" class="note hidden"></p>
        </form>
    </div>
    <iframe name="netlify-target" class="hidden" title="Netlify submission frame"></iframe>

    <script>
        window.onerror = function (msg, src, line, col, err) {
            console.error('[Feedback] window error', msg, src, line, col, err);
        };

        // Populate lesson name from query string so we know which page sent the feedback
        (function populateLesson() {
            const params = new URLSearchParams(window.location.search);
            const lesson = params.get('lesson') || 'Unknown';
            const chip = document.getElementById('lessonChip');
            const hiddenLesson = document.getElementById('lessonField');
            chip.textContent = lesson;
            hiddenLesson.value = lesson;
        })();

        // Global handler wired via onsubmit attribute to ensure execution
        function handleFeedbackSubmit(e) {
            const form = document.getElementById('feedbackForm');
            const status = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');
            if (!form || !status || !submitBtn) {
                console.error('[Feedback] form/status/button missing');
                return true; // allow native submit
            }

            console.log('[Feedback] handler attached and running');
            e.preventDefault();

            status.classList.remove('hidden');
            status.textContent = 'Sending...';
            submitBtn.disabled = true;

            const formData = new FormData(form);
            const body = new URLSearchParams();
            formData.forEach((value, key) => body.append(key, value));
            if (!body.get('form-name')) {
                body.append('form-name', form.getAttribute('name') || 'lesson-feedback');
            }

            (async () => {
                try {
                    const endpoint = form.getAttribute('action') || '/';
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'application/json'
                        },
                        body: body.toString(),
                        mode: 'cors',
                    });
                    console.log('[Feedback] fetch response', res.type, res.status);
                } catch (err) {
                    console.error('[Feedback] fetch error', err);
                } finally {
                    try {
                        form.submit();
                        status.textContent = 'Submitted! Check Netlify form “lesson-feedback”.';
                    } catch (err) {
                        console.error('[Feedback] iframe submit error', err);
                        status.textContent = 'Submit failed. Please try again.';
                    } finally {
                        submitBtn.disabled = false;
                    }
                }
            })();

            return false;
        }
    </script>
</body>
</html>
